kind : Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: Control-plane
     kubeamdConfigPatches:
      - |
     kind: InitConfiguration
      nodeRegistration:
       kubeletExtraArg:
        nodes-lables: "ingress-ready=true"
      extraPortMapping:
     -  containerPort: 80
        hostPort: 80
         Protocol: TCP
     - containerPort: 443
        hostPort: 443
         Protocol: TCP
